<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Profile - MiniSocial</title>

    <link
        rel="stylesheet"
        href="css/style.css">

</head>

<body>

<nav class="navbar">

    <div class="logo">
        MiniSocial
    </div>

    <div class="nav-links">

        <button
            onclick="location.href='index.html'">
            Home
        </button>

        <button onclick="logout()">
            Logout
        </button>

    </div>

</nav>


<div class="container">

    <div class="profile-card">

        <div
            class="avatar"
            id="avatar">
            U
        </div>

        <h2 id="profileName">
            User
        </h2>

        <p id="profileEmail">
            email@example.com
        </p>

        <br>

        <p>
            🌟 MiniSocial Member
        </p>

    </div>

</div>


<script src="js/script.js"></script>

</body>

</html>
