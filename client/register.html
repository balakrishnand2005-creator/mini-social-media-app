<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Register - MiniSocial</title>

    <link
        rel="stylesheet"
        href="css/style.css">

</head>

<body>

<div class="auth-container">

    <h2>MiniSocial</h2>

    <h3>Create Account</h3>

    <br>

    <form onsubmit="registerUser(event)">

        <input
            type="text"
            id="name"
            placeholder="Full Name"
            required>

        <input
            type="email"
            id="email"
            placeholder="Email"
            required>

        <input
            type="password"
            id="password"
            placeholder="Password"
            required
            minlength="4">

        <button
            class="btn"
            type="submit">

            Register

        </button>

    </form>

    <p>
        Already have an account?
        <a href="login.html">
            Login
        </a>
    </p>

</div>


<script src="js/script.js"></script>

</body>

</html>
