<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Login - MiniSocial</title>

    <link
        rel="stylesheet"
        href="css/style.css">

</head>


<body>


<div class="auth-container">


    <h1>MiniSocial</h1>

    <h2>Login</h2>

    <br>


    <form
        onsubmit="loginUser(event)">


        <input
            type="email"
            id="email"
            placeholder="Email"
            required>


        <input
            type="password"
            id="password"
            placeholder="Password"
            required>


        <button
            type="submit"
            class="btn">

            Login

        </button>


    </form>


    <p>

        Don't have an account?

        <a href="register.html">
            Register
        </a>

    </p>


</div>


<script src="js/script.js"></script>

</body>

</html>
